<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bg2)"/>
  <circle cx="700" cy="80" r="150" fill="#38bdf8" opacity="0.08" filter="url(#glow2)"/>
  <circle cx="100" cy="400" r="160" fill="#2563eb" opacity="0.08" filter="url(#glow2)"/>

  <!-- Browser Window Wrapper -->
  <g transform="translate(60, 45)">
    <rect width="680" height="390" rx="14" fill="#090e1a" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Titlebar -->
    <rect width="680" height="44" rx="14" fill="#111827"/>
    <rect y="30" width="680" height="14" fill="#111827"/>
    <line x1="0" y1="44" x2="680" y2="44" stroke="#1f2937" stroke-width="1"/>
    
    <!-- Dots -->
    <circle cx="24" cy="22" r="5.5" fill="#ef4444"/>
    <circle cx="42" cy="22" r="5.5" fill="#f59e0b"/>
    <circle cx="60" cy="22" r="5.5" fill="#10b981"/>

    <!-- URL Bar -->
    <rect x="95" y="10" width="450" height="24" rx="6" fill="#030712" stroke="#1f2937" stroke-width="1"/>
    <text x="110" y="26" fill="#64748b" font-family="sans-serif" font-size="11">https://mymart-store.local/catalog.php?category=electronics</text>

    <!-- Store Navigation Bar inside page -->
    <g transform="translate(20, 56)">
      <rect width="640" height="48" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <!-- Brand Logo / Spark -->
      <circle cx="30" cy="24" r="12" fill="#0284c7"/>
      <path d="M 30 15 L 30 33 M 21 24 L 39 24 M 24 18 L 36 30 M 24 30 L 36 18" stroke="#ffb703" stroke-width="2" stroke-linecap="round"/>
      <text x="50" y="29" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="800">Walmart<tspan fill="#38bdf8">Clone</tspan></text>
      
      <!-- Search Input Mock -->
      <rect x="190" y="10" width="280" height="28" rx="14" fill="#0b1120" stroke="#475569" stroke-width="1"/>
      <text x="210" y="28" fill="#94a3b8" font-family="sans-serif" font-size="11">Search products, brands and deals...</text>
      <circle cx="452" cy="24" r="9" fill="#0284c7"/>
      
      <!-- Right actions -->
      <rect x="490" y="12" width="65" height="24" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="500" y="28" fill="#e2e8f0" font-family="sans-serif" font-size="10">Sign In</text>

      <rect x="565" y="12" width="65" height="24" rx="4" fill="#0284c7"/>
      <text x="577" y="28" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">Cart (3)</text>
    </g>

    <!-- Product Cards Grid (3 Columns) -->
    <g transform="translate(20, 116)">
      <!-- Product 1 -->
      <rect x="0" y="0" width="200" height="245" rx="10" fill="url(#cardGrad2)" stroke="#1e293b" stroke-width="1"/>
      <rect x="12" y="12" width="176" height="105" rx="6" fill="#0a0f1d"/>
      <circle cx="100" cy="65" r="32" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <path d="M 88 65 A 12 12 0 0 1 112 65" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none"/>
      <rect x="80" y="60" width="8" height="18" rx="3" fill="#38bdf8"/>
      <rect x="112" y="60" width="8" height="18" rx="3" fill="#38bdf8"/>
      
      <text x="14" y="136" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">Wireless Noise-Canceling</text>
      <text x="14" y="152" fill="#94a3b8" font-family="sans-serif" font-size="10">Over-Ear Headset</text>
      <text x="14" y="174" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">$89.99</text>
      <text x="70" y="174" fill="#64748b" font-family="sans-serif" font-size="10" text-decoration="line-through">$129.99</text>
      <rect x="14" y="195" width="172" height="28" rx="6" fill="#0284c7"/>
      <text x="68" y="213" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Add to Cart</text>

      <!-- Product 2 -->
      <rect x="220" y="0" width="200" height="245" rx="10" fill="url(#cardGrad2)" stroke="#1e293b" stroke-width="1"/>
      <rect x="232" y="12" width="176" height="105" rx="6" fill="#0a0f1d"/>
      <rect x="270" y="38" width="60" height="50" rx="4" fill="#1e293b" stroke="#334155"/>
      <circle cx="300" cy="62" r="12" fill="#0284c7" opacity="0.4"/>
      
      <text x="234" y="136" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">Smart 4K Ultra OLED TV</text>
      <text x="234" y="152" fill="#94a3b8" font-family="sans-serif" font-size="10">HDR10+ Entertainment Hub</text>
      <text x="234" y="174" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">$499.00</text>
      <rect x="234" y="195" width="172" height="28" rx="6" fill="#0284c7"/>
      <text x="288" y="213" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Add to Cart</text>

      <!-- PHP / MySQL Backend Architecture card on Right -->
      <g transform="translate(440, 0)">
        <rect width="200" height="245" rx="10" fill="#0a101f" stroke="#1e293b" stroke-width="1"/>
        <text x="16" y="28" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">// BACKEND ARCHITECTURE</text>
        
        <rect x="16" y="44" width="168" height="52" rx="6" fill="#111c33" stroke="#1e293b"/>
        <text x="26" y="64" fill="#a5b4fc" font-family="sans-serif" font-size="11" font-weight="bold">PHP Session Auth</text>
        <text x="26" y="82" fill="#94a3b8" font-family="sans-serif" font-size="9">Secure login &amp; cart management</text>

        <rect x="16" y="104" width="168" height="52" rx="6" fill="#111c33" stroke="#1e293b"/>
        <text x="26" y="124" fill="#67e8f9" font-family="sans-serif" font-size="11" font-weight="bold">MySQL Relational DB</text>
        <text x="26" y="142" fill="#94a3b8" font-family="sans-serif" font-size="9">Normalized catalog &amp; orders</text>

        <g transform="translate(16, 172)">
          <rect width="78" height="24" rx="4" fill="#1e293b"/>
          <text x="18" y="16" fill="#f8fafc" font-family="sans-serif" font-size="10">PHP 8</text>

          <rect x="88" y="0" width="80" height="24" rx="4" fill="#1e293b"/>
          <text x="96" y="16" fill="#f59e0b" font-family="sans-serif" font-size="10">MySQL</text>
        </g>

        <rect x="16" y="206" width="168" height="24" rx="4" fill="#1e293b"/>
        <text x="44" y="222" fill="#a855f7" font-family="sans-serif" font-size="10">Bootstrap 5 UI</text>
      </g>
    </g>
  </g>
</svg>
