<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bg3)"/>
  <circle cx="680" cy="90" r="150" fill="#6366f1" opacity="0.09" filter="url(#glow3)"/>
  <circle cx="120" cy="390" r="160" fill="#10b981" opacity="0.08" filter="url(#glow3)"/>

  <!-- JavaFX Desktop Application Window Wrapper -->
  <g transform="translate(60, 45)">
    <!-- Window Base Frame -->
    <rect width="680" height="390" rx="12" fill="#0b1120" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Titlebar (Desktop App style) -->
    <rect width="680" height="40" rx="12" fill="#172033"/>
    <rect y="28" width="680" height="12" fill="#172033"/>
    <line x1="0" y1="40" x2="680" y2="40" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Java Icon & App Title -->
    <circle cx="24" cy="20" r="10" fill="#f97316" opacity="0.2"/>
    <path d="M 22 14 C 20 18, 28 20, 24 26" stroke="#f97316" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M 25 15 C 23 18, 29 20, 26 25" stroke="#f97316" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <text x="42" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">SmartSpend — JavaFX Finance Analytics [Desktop Client]</text>

    <!-- Window Controls (Minimize, Maximize, Close) -->
    <line x1="620" y1="20" x2="630" y2="20" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="638" y="15" width="10" height="10" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M 658 15 L 668 25 M 668 15 L 658 25" stroke="#ef4444" stroke-width="1.5"/>

    <!-- Desktop App Body: Sidebar & Dashboard View -->
    <g transform="translate(0, 40)">
      <!-- Sidebar -->
      <rect width="160" height="350" fill="#090e1a"/>
      <line x1="160" y1="0" x2="160" y2="350" stroke="#1e293b" stroke-width="1"/>

      <!-- Sidebar Items -->
      <rect x="12" y="20" width="136" height="32" rx="6" fill="#1e293b"/>
      <circle cx="28" cy="36" r="4" fill="#10b981"/>
      <text x="42" y="40" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="600">Dashboard</text>

      <rect x="12" y="60" width="136" height="30" rx="6" fill="transparent"/>
      <text x="42" y="79" fill="#94a3b8" font-family="sans-serif" font-size="11">Transactions</text>

      <rect x="12" y="96" width="136" height="30" rx="6" fill="transparent"/>
      <text x="42" y="115" fill="#94a3b8" font-family="sans-serif" font-size="11">Monthly Reports</text>

      <rect x="12" y="132" width="136" height="30" rx="6" fill="transparent"/>
      <text x="42" y="151" fill="#94a3b8" font-family="sans-serif" font-size="11">Budget Goals</text>

      <!-- DB Status Pill at bottom of sidebar -->
      <g transform="translate(12, 280)">
        <rect width="136" height="48" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1"/>
        <circle cx="24" cy="24" r="4" fill="#10b981"/>
        <text x="36" y="21" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="bold">JDBC CONNECTED</text>
        <text x="36" y="36" fill="#64748b" font-family="sans-serif" font-size="9">MySQL Port 3306</text>
      </g>

      <!-- Main Dashboard Content -->
      <g transform="translate(180, 20)">
        <!-- Top Stats Row (3 KPI Cards) -->
        <!-- KPI 1: Net Balance -->
        <rect x="0" y="0" width="150" height="70" rx="8" fill="#131c31" stroke="#1e293b"/>
        <text x="14" y="22" fill="#94a3b8" font-family="sans-serif" font-size="10">TOTAL BALANCE</text>
        <text x="14" y="48" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold">₹42,850.00</text>
        <rect x="100" y="12" width="36" height="16" rx="4" fill="#10b981" opacity="0.2"/>
        <text x="105" y="24" fill="#34d399" font-family="sans-serif" font-size="9">+12.4%</text>

        <!-- KPI 2: Income -->
        <rect x="162" y="0" width="150" height="70" rx="8" fill="#131c31" stroke="#1e293b"/>
        <text x="176" y="22" fill="#94a3b8" font-family="sans-serif" font-size="10">MONTHLY INCOME</text>
        <text x="176" y="48" fill="#34d399" font-family="sans-serif" font-size="16" font-weight="bold">₹65,000.00</text>

        <!-- KPI 3: Expense -->
        <rect x="324" y="0" width="150" height="70" rx="8" fill="#131c31" stroke="#1e293b"/>
        <text x="338" y="22" fill="#94a3b8" font-family="sans-serif" font-size="10">EXPENSES</text>
        <text x="338" y="48" fill="#f87171" font-family="sans-serif" font-size="16" font-weight="bold">₹22,150.00</text>

        <!-- Financial Trend Chart & Recent Transactions -->
        <!-- Chart Box -->
        <g transform="translate(0, 85)">
          <rect width="280" height="150" rx="8" fill="#131c31" stroke="#1e293b"/>
          <text x="14" y="24" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold">Monthly Cash Flow Trend</text>
          
          <!-- Bar chart bars -->
          <line x1="20" y1="125" x2="260" y2="125" stroke="#334155" stroke-width="1"/>
          
          <!-- Jan -->
          <rect x="36" y="70" width="22" height="55" rx="3" fill="url(#barGrad)"/>
          <text x="39" y="139" fill="#94a3b8" font-family="sans-serif" font-size="9">Jan</text>
          
          <!-- Feb -->
          <rect x="76" y="55" width="22" height="70" rx="3" fill="url(#barGrad)"/>
          <text x="79" y="139" fill="#94a3b8" font-family="sans-serif" font-size="9">Feb</text>
          
          <!-- Mar -->
          <rect x="116" y="40" width="22" height="85" rx="3" fill="url(#barGrad)"/>
          <text x="119" y="139" fill="#94a3b8" font-family="sans-serif" font-size="9">Mar</text>
          
          <!-- Apr -->
          <rect x="156" y="60" width="22" height="65" rx="3" fill="url(#barGrad)"/>
          <text x="159" y="139" fill="#94a3b8" font-family="sans-serif" font-size="9">Apr</text>
          
          <!-- May -->
          <rect x="196" y="30" width="22" height="95" rx="3" fill="url(#purpleGrad)"/>
          <text x="199" y="139" fill="#a5b4fc" font-family="sans-serif" font-size="9" font-weight="bold">May</text>

          <!-- Jun -->
          <rect x="236" y="45" width="18" height="80" rx="3" fill="url(#barGrad)"/>
        </g>

        <!-- Right Box: Tech Implementation Details -->
        <g transform="translate(295, 85)">
          <rect width="179" height="150" rx="8" fill="#090e1a" stroke="#1e293b"/>
          <text x="14" y="24" fill="#a855f7" font-family="monospace" font-size="10" font-weight="bold">// ARCHITECTURE</text>
          
          <rect x="14" y="38" width="151" height="26" rx="4" fill="#1e293b"/>
          <text x="24" y="55" fill="#f8fafc" font-family="sans-serif" font-size="10">Java 17 Core &amp; OOPs</text>

          <rect x="14" y="70" width="151" height="26" rx="4" fill="#1e293b"/>
          <text x="24" y="87" fill="#f8fafc" font-family="sans-serif" font-size="10">JavaFX SceneGraph UI</text>

          <rect x="14" y="102" width="151" height="26" rx="4" fill="#1e293b"/>
          <text x="24" y="119" fill="#f8fafc" font-family="sans-serif" font-size="10">JDBC &amp; MySQL Transactions</text>
        </g>

        <!-- Bottom Pill Bar -->
        <g transform="translate(0, 248)">
          <rect width="474" height="62" rx="8" fill="#131c31" stroke="#1e293b"/>
          <text x="16" y="24" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">Real-time Transaction Persistence</text>
          <text x="16" y="44" fill="#94a3b8" font-family="sans-serif" font-size="10">ACID-compliant relational database ledger tracking every financial event.</text>
        </g>
      </g>
    </g>
  </g>
</svg>
